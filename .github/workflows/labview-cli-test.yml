name: LabVIEW Windows CLI Command Tests
run-name: LabVIEW Windows CLI - ${{ github.sha }}

on:
  workflow_dispatch:

jobs:
  test-labview-windows-cli:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Windows LabVIEW image
        run: docker pull nationalinstruments/labview:2026q1-windows
        timeout-minutes: 30

      - name: Test 1 - LabVIEWCLI -Version -Headless
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -Version -Headless ==="
          docker run --rm nationalinstruments/labview:2026q1-windows LabVIEWCLI -Version -Headless

      - name: Test 2 - LabVIEWCLI -Help -Headless
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -Help -Headless ==="
          docker run --rm nationalinstruments/labview:2026q1-windows LabVIEWCLI -Help -Headless

      - name: Test 3 - LabVIEWCLI -ListOperations -Headless
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -ListOperations -Headless ==="
          docker run --rm nationalinstruments/labview:2026q1-windows LabVIEWCLI -ListOperations -Headless

      - name: Test 4 - LabVIEWCLI MassCompile help -Headless
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -OperationName MassCompile -Help -Headless ==="
          docker run --rm nationalinstruments/labview:2026q1-windows LabVIEWCLI -OperationName MassCompile -Help -Headless

      - name: Test 5 - LabVIEWCLI CreateComparisonReport help -Headless
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -OperationName CreateComparisonReport -Help -Headless ==="
          docker run --rm nationalinstruments/labview:2026q1-windows LabVIEWCLI -OperationName CreateComparisonReport -Help -Headless

      - name: Test 6 - LabVIEWCLI PrintToSingleFileHtml help -Headless
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -OperationName PrintToSingleFileHtml -Help -Headless ==="
          docker run --rm nationalinstruments/labview:2026q1-windows LabVIEWCLI -OperationName PrintToSingleFileHtml -Help -Headless

      - name: Test 7 - LabVIEWCLI ExecuteVI -Headless on test.vi
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -OperationName ExecuteVI -Headless ==="
          docker run --rm -v "${{ github.workspace }}:C:\workspace" nationalinstruments/labview:2026q1-windows LabVIEWCLI -OperationName ExecuteVI -VI "C:\workspace\test.vi" -Headless -LogToConsole TRUE

      - name: Test 8 - LabVIEWCLI BuildVI -Headless on test.vi
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -OperationName BuildVI -Headless ==="
          docker run --rm -v "${{ github.workspace }}:C:\workspace" nationalinstruments/labview:2026q1-windows LabVIEWCLI -OperationName BuildVI -VI "C:\workspace\test.vi" -Headless -LogToConsole TRUE

      - name: Test 9 - LabVIEWCLI CreateComparisonReport -Headless
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -OperationName CreateComparisonReport -Headless ==="
          docker run --rm -v "${{ github.workspace }}:C:\workspace" nationalinstruments/labview:2026q1-windows LabVIEWCLI -OperationName CreateComparisonReport -SourceVI "C:\workspace\test.vi" -TargetVI "C:\workspace\test-vi.vi" -Headless -LogToConsole TRUE

      - name: Test 10 - LabVIEWCLI MassCompile -Headless
        continue-on-error: true
        run: |
          Write-Host "=== Test: LabVIEWCLI -OperationName MassCompile -Headless ==="
          docker run --rm -v "${{ github.workspace }}:C:\workspace" nationalinstruments/labview:2026q1-windows LabVIEWCLI -OperationName MassCompile -DirectoryToCompile "C:\workspace" -Headless -LogToConsole TRUE
          echo "python3: $(which python3)"
          echo "git: $(which git)"

      - name: Test 11 - Check LabVIEW user permissions
        continue-on-error: true
        run: |
          echo "=== Current user and home ==="
          whoami
          id
          echo "HOME: $HOME"
          echo "PWD: $PWD"

      - name: Test 12 - Parse test VI (binary info)
        continue-on-error: true
        run: |
          echo "=== VI file info ==="
          if [ -f "test.vi" ]; then
            file test.vi
            hexdump -C test.vi | head -10
          else
            echo "test.vi not found"
          fi
