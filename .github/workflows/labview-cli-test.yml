name: LabVIEW Linux CLI Command Tests
run-name: LabVIEW CLI - ${{ github.sha }}

on:
  workflow_dispatch:

jobs:
  test-labview-cli-commands:
    runs-on: ubuntu-latest
    container:
      image: nationalinstruments/labview:2026q1-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test 1 - LabVIEWCLI help (headless mode, with -LabVIEWPath)
        continue-on-error: true
        run: |
          echo "=== Test: LabVIEWCLI -LabVIEWPath /usr/local/natinst/LabVIEW-2026-64 -Help -Headless ==="
          timeout 10 LabVIEWCLI -LabVIEWPath "/usr/local/natinst/LabVIEW-2026-64" -Help -Headless || echo "Exit code: $?"

      - name: Test 2 - LabVIEWCLI MassCompile help (headless, with -LabVIEWPath)
        continue-on-error: true
        run: |
          echo "=== Test: LabVIEWCLI -LabVIEWPath /usr/local/natinst/LabVIEW-2026-64 -OperationName MassCompile -Help -Headless ==="
          timeout 10 LabVIEWCLI -LabVIEWPath "/usr/local/natinst/LabVIEW-2026-64" -OperationName MassCompile -Help -Headless || echo "Exit code: $?"

      - name: Test 2b - LabVIEWCLI CreateComparisonReport help (VIDiff operation)
        continue-on-error: true
        run: |
          echo "=== Test: LabVIEWCLI -LabVIEWPath /usr/local/natinst/LabVIEW-2026-64 -OperationName CreateComparisonReport -Help -Headless ==="
          timeout 10 LabVIEWCLI -LabVIEWPath "/usr/local/natinst/LabVIEW-2026-64" -OperationName CreateComparisonReport -Help -Headless || echo "Exit code: $?"

      - name: Test 2c - LabVIEWCLI PrintToSingleFileHtml help (VIDiff operation for added/deleted VIs)
        continue-on-error: true
        run: |
          echo "=== Test: LabVIEWCLI -LabVIEWPath /usr/local/natinst/LabVIEW-2026-64 -OperationName PrintToSingleFileHtml -Help -Headless ==="
          timeout 10 LabVIEWCLI -LabVIEWPath "/usr/local/natinst/LabVIEW-2026-64" -OperationName PrintToSingleFileHtml -Help -Headless || echo "Exit code: $?"

      - name: Test 3 - Find LabVIEW binary
        continue-on-error: true
        run: |
          echo "=== Test: find LabVIEW binary ==="
          find /usr/local/natinst -name "LabVIEW*" -type f 2>/dev/null | head -20

      - name: Test 4 - Check LV_YEAR environment variable
        continue-on-error: true
        run: |
          echo "=== LV_YEAR env var ==="
          echo "LV_YEAR=${LV_YEAR:-NOT SET}"
          echo "LabVIEW path: /usr/local/natinst/LabVIEW-${LV_YEAR}-64"

      - name: Test 5 - LabVIEWCLI MassCompile on a directory (headless, with -LabVIEWPath)
        continue-on-error: true
        run: |
          echo "=== Test: LabVIEWCLI -LabVIEWPath /usr/local/natinst/LabVIEW-2026-64 -OperationName MassCompile -DirectoryToCompile /tmp -Headless ==="
          timeout 30 LabVIEWCLI -LabVIEWPath "/usr/local/natinst/LabVIEW-2026-64" -OperationName MassCompile -DirectoryToCompile "/tmp" -Headless || echo "Exit code: $?"

      - name: Test 6 - LabVIEWCLI CloseLabVIEW (graceful shutdown, with -LabVIEWPath)
        continue-on-error: true
        run: |
          echo "=== Test: LabVIEWCLI -LabVIEWPath /usr/local/natinst/LabVIEW-2026-64 -OperationName CloseLabVIEW -Headless ==="
          timeout 10 LabVIEWCLI -LabVIEWPath "/usr/local/natinst/LabVIEW-2026-64" -OperationName CloseLabVIEW -Headless || echo "Exit code: $?"

      - name: Test 7 - LabVIEW environment variables
        continue-on-error: true
        run: |
          echo "=== LabVIEW environment variables ==="
          env | grep -i labview || echo "No LABVIEW_* env vars"
          env | grep -i lv_ || echo "No LV_* env vars"

      - name: Test 8 - LabVIEW binary location
        continue-on-error: true
        run: |
          echo "=== LabVIEW binary inspection ==="
          ls -lh /usr/local/natinst/LabVIEW*/bin/LabVIEW* 2>/dev/null | head -10 || echo "Binary not found"

      - name: Test 9 - Check for PrintToSingleFileHtml.vi
        continue-on-error: true
        run: |
          echo "=== Check for PrintToSingleFileHtml.vi (critical for VI rendering) ==="
          find /usr/local/natinst -name "*PrintToSingleFileHtml*" -o -name "*PrintTo*" 2>/dev/null | head -20
          echo "=== Also checking for .so files related to rendering ==="
          find /usr/local/natinst -name "*Print*" -type f 2>/dev/null | grep -E "\.(so|vi)$" | head -20

      - name: Test 10 - Check LD_LIBRARY_PATH and library locations
        continue-on-error: true
        run: |
          echo "=== LD_LIBRARY_PATH ==="
          echo "${LD_LIBRARY_PATH:-NOT SET}"
          echo "=== Look for libniDotNETCoreInterop.so ==="
          find /usr/local/natinst -name "libniDotNETCoreInterop.so*" 2>/dev/null
          echo "=== Look in lib64 and lib directories ==="
          find /usr/local/natinst/LabVIEW-2026-64 -type d -name "lib*" 2>/dev/null | head -10

      - name: Test 10 - Verify container has bash and basic tools
        continue-on-error: true
        run: |
          echo "=== Shell and tools check ==="
          echo "bash: $(which bash)"
          echo "python3: $(which python3)"
          echo "git: $(which git)"

      - name: Test 11 - Check LabVIEW user permissions
        continue-on-error: true
        run: |
          echo "=== Current user and home ==="
          whoami
          id
          echo "HOME: $HOME"
          echo "PWD: $PWD"

      - name: Test 12 - Parse test VI (binary info)
        continue-on-error: true
        run: |
          echo "=== VI file info ==="
          if [ -f "test.vi" ]; then
            file test.vi
            hexdump -C test.vi | head -10
          else
            echo "test.vi not found"
          fi
