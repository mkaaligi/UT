name: VIDiff Report — Windows Container

on:
  pull_request:
    paths:
      - '**.vi'
      - '**.ctl'
      - '!.github/**'
  push:
    branches: [main]
    paths:
      - '**.vi'
      - '**.ctl'
      - '!.github/**'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Base commit SHA'
        required: false
        default: ''
      head_sha:
        description: 'Head commit SHA'
        required: false
        default: ''
      files:
        description: 'Optional comma/newline-separated VI/CTL paths to diff (default: all changed in the range)'
        required: false
        default: ''

env:
  # Base NI image already includes everything VIDiff needs (CreateComparisonReport /
  # PrintToSingleFileHtml). The custom GHCR image build is not required here.
  LABVIEW_CONTAINER_IMAGE: nationalinstruments/labview:latest-windows

permissions:
  contents: read
  statuses: write
  packages: read
  actions: read   # so wait-for-worker-image.sh can read the worker-image build runs

jobs:
  vidiff:
    runs-on: windows-2022   # windows-latest = Server 2025, broken Docker daemon

    steps:
      - name: Determine SHAs
        id: shas
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expand() {
            local s="$1"
            [ -z "$s" ] && echo "" && return
            gh api "repos/${{ github.repository }}/commits/$s" --jq '.sha' 2>/dev/null || echo "$s"
          }
          if [ -n "${{ github.event.inputs.head_sha }}" ]; then
            HEAD=$(expand "${{ github.event.inputs.head_sha }}")
            BASE=$(expand "${{ github.event.inputs.base_sha }}")
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD="${{ github.event.pull_request.head.sha }}"
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            HEAD="${{ github.sha }}"
            BASE="${{ github.event.before }}"
          fi
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Checkout head commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.shas.outputs.head }}
          fetch-depth: 0
          path: head

      - name: Checkout base commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.shas.outputs.base }}
          path: base

      - name: Get changed files
        id: changed
        shell: bash
        run: |
          cd head
          FILES=""
          if git rev-parse ${{ steps.shas.outputs.base }}..HEAD > /dev/null 2>&1; then
            FILES=$(git diff --name-only ${{ steps.shas.outputs.base }}..HEAD | grep -E '\.(vi|ctl)$' || true)
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed VI/CTL files:"
          echo "$FILES"

      - name: Run VIDiff action
        if: steps.changed.outputs.files != ''
        uses: ./.github/actions/vidiff
        with:
          head-dir: head
          base-dir: base
          labview-version: '2026'
          changed-files: ${{ steps.changed.outputs.files }}
          report-dir: ci-out/vidiff

      - name: Upload VIDiff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidiff-report
          path: head/ci-out/vidiff/
