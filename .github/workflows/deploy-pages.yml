name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["VIDiff Report — Windows Container", "VI Snapshots and VI Browser"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download VIDiff artifact
      - name: Download VIDiff artifact
        uses: actions/github-script@v7
        id: vidiff-artifact
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              run_id,
            });
            const art = artifacts.data.artifacts.find(a =>
              a.name === 'vidiff-report'
            );
            if (!art) {
              core.info('No VIDiff artifact found.');
              return null;
            }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              artifact_id: art.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/vidiff-artifact.zip', Buffer.from(dl.data));
            return art.name;

      - name: Extract VIDiff artifact
        if: steps.vidiff-artifact.outputs.result != 'null'
        shell: bash
        run: |
          mkdir -p /tmp/vidiff-report
          unzip -q /tmp/vidiff-artifact.zip -d /tmp/vidiff-report

      - name: Deploy VIDiff report to GitHub Pages
        if: steps.vidiff-artifact.outputs.result != 'null'
        uses: ./.github/actions/publish-gh-pages
        with:
          publish_dir: /tmp/vidiff-report
          destination_dir: vidiff

      # Download VI Snapshots artifact
      - name: Download VI Snapshots artifact
        uses: actions/github-script@v7
        id: snapshots-artifact
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              run_id,
            });
            const art = artifacts.data.artifacts.find(a =>
              a.name === 'vi-snapshots'
            );
            if (!art) {
              core.info('No VI Snapshots artifact found.');
              return null;
            }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              artifact_id: art.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/snapshots-artifact.zip', Buffer.from(dl.data));
            return art.name;

      - name: Extract VI Snapshots artifact
        if: steps.snapshots-artifact.outputs.result != 'null'
        shell: bash
        run: |
          mkdir -p /tmp/vi-snapshots-report
          unzip -q /tmp/snapshots-artifact.zip -d /tmp/vi-snapshots-report

      - name: Deploy VI Snapshots to GitHub Pages
        if: steps.snapshots-artifact.outputs.result != 'null'
        uses: ./.github/actions/publish-gh-pages
        with:
          publish_dir: /tmp/vi-snapshots-report
          destination_dir: vi-snapshots
