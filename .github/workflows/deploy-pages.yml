name: Deploy VIDiff to GitHub Pages

on:
  workflow_run:
    workflows: ["VIDiff Report — Windows Container"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Download artifacts from workflow
        uses: dawidd6/download-artifact@v2
        with:
          workflow: vidiff.yml
          branch: main
          path: vidiff-out

      - name: Deploy to gh-pages
        shell: bash
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # Get or create gh-pages branch
          git fetch origin gh-pages 2>/dev/null || true
          git checkout -b gh-pages origin/gh-pages 2>/dev/null || git checkout --orphan gh-pages
          
          # Clear and deploy
          find . -mindepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
          
          if [ -d "vidiff-out/vidiff-report" ]; then
            cp -r vidiff-out/vidiff-report/* .
          fi
          
          # Commit and push
          git add .
          git commit -m "Deploy VIDiff reports [skip ci]" --allow-empty
          git push origin gh-pages
