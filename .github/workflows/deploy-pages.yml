name: Deploy VIDiff to GitHub Pages

on:
  workflow_run:
    workflows: ["VIDiff Report — Windows Container"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: vidiff-report
          path: artifact-files

      - name: Deploy to gh-pages
        shell: bash
        run: |
          # Create gh-pages branch if it doesn't exist
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # Create or checkout gh-pages
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi
          
          # Clear old content and copy new
          rm -rf *
          if [ -d "artifact-files" ]; then
            cp -r artifact-files/* . || true
          fi
          
          # Add and push
          git add .
          git commit -m "Deploy VIDiff reports" || echo "No changes to commit"
          git push origin gh-pages -f
