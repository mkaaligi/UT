name: Deploy VIDiff to GitHub Pages

on:
  workflow_run:
    workflows: ["VIDiff Report — Windows Container"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download VIDiff artifacts
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: vidiff.yml
          path: artifacts

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create pages structure
        shell: bash
        run: |
          mkdir -p site
          # Copy VIDiff report to site
          if [ -d "artifacts/vidiff-report" ]; then
            cp -r artifacts/vidiff-report/* site/ || true
          fi
          # Create index if it doesn't exist
          if [ ! -f "site/index.html" ]; then
            cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>VI Reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 2em; }
              h1 { color: #0969da; }
              .report { margin: 1em 0; padding: 1em; background: #f6f8fa; border-radius: 8px; }
              a { color: #0969da; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>VI Reports - Private Dashboard</h1>
            <div class="report">
              <h2>VIDiff Reports</h2>
              <p><a href="index.html">View Latest VIDiff Report →</a></p>
            </div>
          </body>
          </html>
          EOF
          fi

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
